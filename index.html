<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JOKS STORE — المتجر الرسمي</title>
    <style>
        body { background: #0b0b0b; color: #fff; font-family: Tahoma, sans-serif; text-align: center; margin: 0; padding: 20px; }
        .card { background: #161616; border: 2px solid #ff1e1e; border-radius: 12px; padding: 20px; max-width: 400px; margin: 20px auto; }
        button { background: #ff1e1e; color: #fff; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; width: 100%; margin-top: 10px; }
        button:active { background: #b30000; }
        input { width: 100%; padding: 10px; margin: 8px 0; background: #000; border: 1px solid #444; color: #fff; border-radius: 6px; text-align: center; box-sizing: border-box; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; }
        .modal-content { background: #1a1a1a; padding: 20px; border-radius: 12px; width: 90%; max-width: 350px; border: 1px solid #ff1e1e; }
    </style>
</head>
<body>

    <h1>JOKS STORE 🚀</h1>
    <p>متجر شحن الألعاب الرسمي عبر إنستا باي</p>

    <div class="card">
        <h3>شحن فري فاير وببجي</h3>
        <p style="color: #aaa; font-size: 14px;">التحويل حصراً على رقم إنستا باي:<br><b style="color: #ff1e1e; font-size: 18px;">01001477719</b></p>
        <button onclick="openModal()">اضغط هنا لاختيار الباقة والشحن</button>
    </div>

    <!-- نافذة الطلب -->
    <div id="myModal" class="modal">
        <div class="modal-content">
            <h3 style="color: #ff1e1e;">إتمام الطلب</h3>
            <input type="text" id="p_game" placeholder="اسم اللعبة (مثال: ببجي / فري فاير)">
            <input type="text" id="p_id" placeholder="اكتب ID اللاعب هنا">
            <input type="text" id="p_phone" placeholder="رقم الموبايل المحول منه">
            <button onclick="sendOrder()">تأكيد وإرسال الطلب ✓</button>
            <button style="background: #444; margin-top: 5px;" onclick="closeModal()">إغلاق</button>
        </div>
    </div>

    <script>
        function openModal() {
            document.getElementById('myModal').style.display = 'flex';
        }
        function closeModal() {
            document.getElementById('myModal').style.display = 'none';
        }
        function sendOrder() {
            let game = document.getElementById('p_game').value;
            let id = document.getElementById('p_id').value;
            let phone = document.getElementById('p_phone').value;
            
            if(!game || !id || !phone) {
                alert("برجاء ملء جميع البيانات!");
                return;
            }
            alert("تم تسجيل طلبك بنجاح يا يوسف! سيتم التحقق من التحويل على رقم 01001477719 والشحن فوراً.");
            closeModal();
        }
    </script>
</body>
</html>
